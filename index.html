<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pistas de Color</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e7e6e2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen game table — score strip on top, the 30×16 colour board as the hero, an action tray below; private moments open as opaque full-screen sheets. Phones get their own controller screen. */
:root {
  --bg: #e7e6e2;
  --surface: #f6f5f2;
  --ink: #1c1c20;
  --ink-soft: #3a3a40;
  --muted: #6c6b72;
  --line: #d2d0ca;
  --on-ink: #f6f5f2;
  --ring-light: #ffffff;
  --ring-dark: #000000;
  --scrim: rgba(231, 230, 226, 0.72);
  --ok: #178a4c;
  --warn: #c2410c;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18181b; --surface: #232327; --ink: #f1f0ec; --ink-soft: #d6d5d0; --muted: #a2a1a8;
    --line: #3a3a40; --on-ink: #18181b; --scrim: rgba(24, 24, 27, 0.74); --ok: #4ade80; --warn: #fb923c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18181b; --surface: #232327; --ink: #f1f0ec; --ink-soft: #d6d5d0; --muted: #a2a1a8;
  --line: #3a3a40; --on-ink: #18181b; --scrim: rgba(24, 24, 27, 0.74); --ok: #4ade80; --warn: #fb923c; color-scheme: dark;
}

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
input { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }

#app, #phone {
  height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}

/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font: 800 22px/1 var(--display); letter-spacing: -0.02em; }
.logo { display: grid; grid-template-columns: repeat(2, 9px); gap: 2px; }
.logo i { width: 9px; height: 9px; border-radius: 2px; display: block; }
.turninfo { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scores { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 4px;
  border-radius: 999px; background: var(--surface); border: 1.5px solid transparent;
  font-size: 14px; white-space: nowrap; cursor: pointer;
}
.chip b { font-variant-numeric: tabular-nums; font-weight: 700; }
.chip.now { border-color: var(--ink); }
.chip.off { opacity: 0.45; }
.chip .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.dot {
  --pc: #888; width: 24px; height: 24px; border-radius: 50%; flex: none;
  background: var(--pc); color: #fff; display: grid; place-items: center;
  font: 800 12px/1 var(--display); text-shadow: 0 1px 1px rgba(0,0,0,.4);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.85);
}
.iconbtn {
  font: 700 14px/1 var(--body); color: var(--ink); background: var(--surface);
  border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer; min-height: 36px;
}

/* ---------- board ---------- */
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.board {
  --cell: 24px; --gap: 2px;
  display: grid; gap: var(--gap);
  grid-template-columns: calc(var(--cell) * 0.9) repeat(30, var(--cell));
  grid-template-rows: calc(var(--cell) * 0.8) repeat(16, var(--cell));
}
.lbl {
  display: grid; place-items: center; color: var(--muted);
  font: 700 max(9px, calc(var(--cell) * 0.36)) / 1 var(--body);
}
.cell { position: relative; border-radius: calc(var(--cell) * 0.14); cursor: pointer; }
.cell.sel { z-index: 4; box-shadow: 0 0 0 2px var(--ring-light), 0 0 0 4px var(--ring-dark); }
.cell.dim { filter: saturate(0.6); opacity: 0.6; }
.pawn {
  --pc: #888; position: absolute; inset: 11%; border-radius: 50%; z-index: 2;
  background: var(--pc); color: #fff; display: grid; place-items: center;
  font: 800 max(8px, calc(var(--cell) * 0.38)) / 1 var(--display);
  text-shadow: 0 1px 1px rgba(0,0,0,.45);
  box-shadow: inset 0 0 0 max(1.5px, calc(var(--cell) * 0.07)) var(--ring-light), 0 0 0 1px rgba(0,0,0,.6), 0 2px 5px rgba(0,0,0,.35);
  pointer-events: none;
}
.pawn.ghost { opacity: 0.7; }
.pawn.drop { animation: drop .28s cubic-bezier(.3,1.6,.5,1); }
@keyframes drop { from { transform: translateY(-40%) scale(1.3); opacity: 0; } }
.pts {
  position: absolute; z-index: 6; right: -18%; top: -22%; pointer-events: none;
  background: var(--ring-dark); color: var(--ring-light); border-radius: 999px;
  font: 500 max(9px, calc(var(--cell) * 0.34)) / 1 var(--mono); padding: 2px 4px;
}
.frame {
  z-index: 5; pointer-events: none; border-radius: calc(var(--cell) * 0.2);
  margin: calc(var(--gap) * -1 - 2px);
  border: max(2px, calc(var(--cell) * 0.1)) solid var(--ring-light);
  box-shadow: 0 0 0 2px var(--ring-dark), inset 0 0 0 2px var(--ring-dark);
  animation: frame .45s cubic-bezier(.2,1.4,.4,1);
}
.frame.outer {
  z-index: 3; border-style: dashed; border-width: 2px; box-shadow: none;
  border-color: var(--ring-dark); outline: 2px dashed var(--ring-light); outline-offset: -4px;
  animation-delay: .1s; animation-fill-mode: backwards;
}
.target-mark {
  position: absolute; inset: 22%; z-index: 6; border-radius: 50%; pointer-events: none;
  box-shadow: 0 0 0 3px var(--ring-light), 0 0 0 5px var(--ring-dark);
}
@keyframes frame { from { transform: scale(1.35); opacity: 0; } }

/* ---------- tray ---------- */
.tray {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  background: var(--surface); border-radius: 18px; padding: 12px 16px; min-height: 84px;
}
.eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who .dot { width: 46px; height: 46px; font-size: 22px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.85), 0 2px 6px rgba(0,0,0,.25); }
.big { font: 800 24px/1.1 var(--display); letter-spacing: -0.01em; }
.sub { font-size: 14px; color: var(--muted); }
.clue { min-width: 0; flex: 1 1 200px; }
.cluetext { font: 800 30px/1.1 var(--display); letter-spacing: -0.015em; overflow-wrap: anywhere; }
.cluetext.quiet { font: 400 17px/1.3 var(--body); color: var(--muted); }
.cluetext small { display: block; font: 400 15px/1.3 var(--body); color: var(--muted); }
.preview { display: flex; align-items: center; gap: 10px; }
.swatch { width: 52px; height: 52px; border-radius: 10px; flex: none; background: var(--line); }
.coord { font: 700 22px/1 var(--body); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.btns { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.hint { font-size: 14px; color: var(--muted); }
.hint.warn { color: var(--ink); font-weight: 700; }

button.primary, button.ghost {
  font: 700 17px/1 var(--body); border-radius: 14px; padding: 15px 22px; cursor: pointer;
  border: 2px solid var(--ink); min-height: 52px;
}
button.primary { background: var(--ink); color: var(--on-ink); }
button.ghost { background: transparent; color: var(--ink); }
button:disabled { opacity: 0.35; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button.buzzbtn { border-style: dashed; }

.results { display: flex; flex-wrap: wrap; gap: 8px 18px; flex: 1 1 300px; min-width: 0; }
.res { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.res b { font: 700 18px/1 var(--body); font-variant-numeric: tabular-nums; }

.peek {
  position: relative; width: 150px; height: 56px; border-radius: 12px; border: 2px dashed var(--muted);
  display: grid; place-items: center; text-align: center; font-size: 12px; line-height: 1.2; color: var(--muted);
  padding: 4px 8px; cursor: pointer; touch-action: none; flex: none;
}
.peek.on { border: 2px solid var(--ink); color: transparent; background: var(--peek); }

.timer {
  font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; flex: none;
  padding: 10px 14px; border-radius: 14px; background: var(--bg); min-width: 72px; text-align: center;
}
.timer::after { content: " s"; font-size: 15px; }
.timer.low { background: var(--warn); color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.08); } }

input.text {
  font: 700 20px/1.2 var(--body); color: var(--ink); background: var(--bg);
  border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; min-width: 0;
}
input.text:focus { border-color: var(--ink); outline: none; }

/* ---------- sheets, toast, buzzer ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.sheet.scrim { background: var(--scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.sheet.private { background: var(--bg); }
.card {
  width: 100%; max-width: 580px; max-height: 100%; overflow-y: auto; margin: auto;
  background: var(--surface); border-radius: 24px; padding: 28px;
  display: flex; flex-direction: column; gap: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
}
.card.wide { max-width: 760px; }
.card.small { max-width: 400px; padding: 22px; gap: 14px; }
.card h2 { margin: 0; font: 800 34px/1.05 var(--display); letter-spacing: -0.025em; text-wrap: balance; }
.card.small h2 { font-size: 26px; }
.card h3 { margin: 0; font: 800 18px/1.2 var(--display); }
.card p { margin: 0; color: var(--ink-soft); max-width: 60ch; }
.lead { font-size: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.players { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.prow .dot { width: 34px; height: 34px; font-size: 15px; }
.prow input { flex: 1; font-size: 18px; padding: 10px 12px; }
.prow .nm { flex: 1; font-size: 18px; min-width: 0; overflow-wrap: anywhere; }
.x { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font-size: 24px; cursor: pointer; }
.seg { display: inline-flex; background: var(--bg); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 700 16px/1 var(--body); border-radius: 9px; padding: 11px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.linkbtn { border: 0; background: none; color: var(--ink); font: 700 16px/1 var(--body); text-decoration: underline; text-underline-offset: 3px; padding: 10px 4px; cursor: pointer; }
.setting { display: flex; flex-direction: column; gap: 8px; }

.lobby { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.qr { width: 180px; height: 180px; background: #fff; border-radius: 14px; padding: 10px; flex: none; }
.qr svg { width: 100%; height: 100%; display: block; }
.roomcode { font: 800 54px/1 var(--display); letter-spacing: 0.08em; }
.url { font: 500 14px/1.4 var(--mono); overflow-wrap: anywhere; color: var(--ink-soft); -webkit-user-select: text; user-select: text; }
.net { font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.net::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.net.ok::before { background: var(--ok); }
.net.bad { color: var(--warn); }
.net.bad::before { background: var(--warn); }
.empty { color: var(--muted); font-size: 15px; padding: 10px 0; }

.cardpick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.opt {
  border: 0; border-radius: 16px; padding: 0; cursor: pointer; background: none; color: var(--ink);
  display: flex; flex-direction: column; gap: 8px; align-items: stretch; font: 400 16px/1 var(--body);
}
.opt span.fill { aspect-ratio: 1; max-width: 100%; border-radius: 14px; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.opt[aria-pressed="true"] span.fill { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
.opt[aria-pressed="true"] { font-weight: 700; }
.rules { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; color: var(--ink-soft); }
.rules b { color: var(--ink); }
.scoring { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-size: 15px; }
.scoring .n { font: 800 20px/1 var(--display); }
.rank { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.rank li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--bg); }
.rank li .dot { width: 36px; height: 36px; font-size: 16px; }
.rank li .nm { flex: 1; font-size: 18px; min-width: 0; overflow-wrap: anywhere; }
.rank li b { font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.rank li.first { background: var(--ink); color: var(--on-ink); }
.place { font: 700 15px/1 var(--body); width: 22px; color: inherit; opacity: .7; }

.toast {
  position: fixed; z-index: 80; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%);
  max-width: calc(100% - 32px); background: var(--ink); color: var(--on-ink);
  padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: 15px; text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); pointer-events: none;
}
.buzz {
  --pc: #d7263d; position: fixed; inset: 0; z-index: 90; display: grid; place-items: center;
  background: var(--pc); color: #fff; text-align: center; pointer-events: none; padding: 24px;
}
.buzz.go { animation: buzzin 1.7s ease-out forwards; }
.buzz.go > div { animation: shake .45s ease-in-out 2; }
.buzz-text { font: 800 clamp(44px, 12vw, 120px)/1 var(--display); letter-spacing: -0.03em; text-shadow: 0 3px 0 rgba(0,0,0,.25); text-wrap: balance; }
.buzz-sub { font: 700 20px/1.3 var(--body); margin-top: 14px; opacity: .92; }
@keyframes buzzin { 0% { opacity: 0; } 8% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shake { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-14px) rotate(-3deg); } 40% { transform: translateX(12px) rotate(3deg); } 60% { transform: translateX(-8px) rotate(-2deg); } 80% { transform: translateX(6px) rotate(1deg); } }

/* ---------- phone controller ---------- */
.ph-head { display: flex; align-items: center; gap: 8px; }
.ph-head .net { font-size: 0; gap: 0; }
.ph-head .net::before { width: 11px; height: 11px; }
.ph-head .iconbtn { padding: 9px 12px; }
.ph-head .me {
  display: flex; align-items: center; gap: 8px; font: 800 18px/1.1 var(--display); min-width: 0;
  border: 0; background: var(--surface); color: var(--ink); padding: 4px 12px 4px 4px; border-radius: 999px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto;
}
.ph-head .me .dot { width: 30px; height: 30px; font-size: 14px; }
.ph-head .me .score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 16px; }
.ph-head .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
#phPanel { flex-direction: column; align-items: stretch; gap: 12px; max-height: 62%; overflow-y: auto; }
#phPanel.full { max-height: none; flex: 0 1 auto; min-height: 0; }
#phPanel .cardpick { grid-template-columns: repeat(4, 1fr); gap: 10px; }
#phPanel .rowx { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#phPanel .cluetext { font-size: 26px; }
#phPanel .card-plain { display: flex; flex-direction: column; gap: 14px; }
#phPanel h2 { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
#phPanel h3 { margin: 0; font: 800 17px/1.2 var(--display); }
#phPanel p { margin: 0; color: var(--ink-soft); }
#phPanel button.primary, #phPanel button.ghost { width: 100%; }
#phPanel .rowx button.primary { width: auto; flex: 1; }
#phPanel .qr { width: 150px; height: 150px; }
#phPanel .roomcode { font-size: 40px; }
.ph-board { flex: 1; min-height: 120px; overflow: auto; border-radius: 16px; background: var(--surface); padding: 8px; -webkit-overflow-scrolling: touch; }
.ph-board .board { width: max-content; margin: 0 auto; }
.bigscore { font: 800 44px/1 var(--display); }

@media (max-width: 560px) {
  .cardpick { grid-template-columns: repeat(2, 1fr); }
  .card { padding: 20px; }
  .card h2 { font-size: 28px; }
  .cluetext { font-size: 24px; }
  .brand h1 { font-size: 19px; }
  .lobby { grid-template-columns: 1fr; justify-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  .pawn.drop, .frame, .timer.low, .buzz.go > div { animation: none; }
}
</style>
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.js"></script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><i style="background:#e0533d"></i><i style="background:#e8b52c"></i><i style="background:#2f8f6a"></i><i style="background:#3b5bd6"></i></div>
      <h1>Pistas de Color</h1>
    </div>
    <span class="turninfo" id="turninfo"></span>
    <div class="scores" id="scores"></div>
    <button class="iconbtn" data-action="menu" id="menuBtn">Menú</button>
  </header>
  <main id="stage"><div id="board" class="board" aria-label="Tablero de colores"></div></main>
  <section id="tray" class="tray" aria-live="polite"></section>
</div>

<div id="phone" hidden>
  <div class="ph-head" id="phHead"></div>
  <section id="phPanel" class="tray" aria-live="polite"></section>
  <div class="ph-board" id="phBoardWrap" hidden><div id="phBoard" class="board" aria-label="Tablero de colores"></div></div>
</div>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="buzz" class="buzz" aria-live="assertive" hidden></div>

<script>
(() => {
  const COLS = 30, ROWS = 16, LETTERS = 'ABCDEFGHIJKLMNOP';
  const KEY = 'pistas-de-color-v1', PHONE_KEY = 'pistas-de-color-celular';
  const PCOLORS = ['#d7263d', '#1f4fd1', '#178a4c', '#7b3fe4', '#e46a12', '#0b7c86', '#d6338a', '#7a5523', '#36404f', '#b8860b'];
  const ROOM_LETTERS = 'BCDFGHJKLMNPQRSTVWXZ';
  const PREFIX = 'pistasdecolor-';
  const TIMER_OPTIONS = [0, 30, 60, 90];
  const BUZZ_TEXTS = ['¡Apúrate!', '¡Tic, tac, tic, tac!', '¡Hoy, no mañana!', '¡Que se enfría!', '¡Despierta!', '¡Dale, dale, dale!', '¡El tablero no muerde!', '¡Ya casi es Navidad!'];
  const BUZZ_PHASES = ['pick', 'guess', 'clue2', 'ready'];

  /* ---------- connection settings (overridable for local testing) ---------- */
  const params = new URLSearchParams(location.search);
  const TEST_KEYS = ['peerhost', 'peerport', 'peerpath', 'peersecure'];
  const PEER_OPTS = (() => {
    const o = { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };
    if (params.get('peerhost')) {
      o.host = params.get('peerhost'); o.port = +params.get('peerport') || 9000;
      o.path = params.get('peerpath') || '/'; o.secure = params.get('peersecure') === '1';
      o.config = { iceServers: [] };
    }
    return o;

      const gname = esc(v.players[v.giver].name);
      if (v.step === 1) return v.clue1
        ? `<div class="eyebrow">Pista de ${gname}</div><div class="cluetext">«${esc(v.clue1)}»</div>`
        : `<div class="eyebrow">Pista de ${gname}</div><div class="cluetext quiet">Escucha la pista de una palabra.</div>`;
      const first = v.clue1 ? `<small>Primera: «${esc(v.clue1)}»</small>` : '';
      return v.clue2
        ? `<div class="eyebrow">Segunda pista de ${gname}</div><div class="cluetext">«${esc(v.clue2)}»${first}</div>`
        : `<div class="eyebrow">Segunda pista de ${gname}</div><div class="cluetext quiet">Escucha la pista de dos palabras.${first}</div>`;
    }
    function buzzHTML(v) {
      if (!BUZZ_PHASES.includes(v.phase)) return '';
      const t = targetOf(v);
      if (t == null || t === v.you || !v.players[t]) return '';
      return `<button class="ghost buzzbtn" data-action="p_buzz" ${P.buzzCool ? 'disabled' : ''}>Apurar a ${esc(v.players[t].name)}</button>`;
    }
    const timerHTML = v => v.phase === 'guess' && v.timer ? `<span class="timer">${Math.max(0, Math.ceil((P.deadline - Date.now()) / 1000))}</span>` : '';
    function roomHTML(v, withQR) {
      return `<div class="lobby">
          ${withQR && v.net === 'open' ? `<div class="qr" aria-label="Código QR para entrar">${qrSVG(v.url)}</div>` : ''}
          <div class="stack"><div class="eyebrow">Código de la sala</div><div class="roomcode">${esc(v.room)}</div>
          <div class="url">${esc(v.url)}</div></div></div>`;
    }

    function renderSheet() {
      const sh = $('#sheet'), v = P.v;
      let html = '';
      if (P.popup === 'scores' && v) {
        html = `<div class="card small" role="dialog" aria-modal="true">
          <div class="eyebrow">${v.phase === 'lobby' ? 'Sala ' + esc(v.room) : v.phase === 'end' ? 'Resultado final' : `Turno ${v.turn + 1} de ${v.total}`}</div>
          <h2>Así van</h2>${rankHTML(v.players, v.you)}
          <button class="primary" data-action="p_close">Cerrar</button></div>`;
      } else if (P.popup === 'menu' && v && P.isHost) {
        const playing = !['lobby', 'end'].includes(v.phase);
        html = `<div class="card small" role="dialog" aria-modal="true"><h2>Menú</h2>
          <p>Sala <b>${esc(v.room)}</b> · ${v.net === 'open' ? '<span class="net ok">abierta</span>' : '<span class="net bad">conectando…</span>'}</p>
          <div class="url">${esc(v.url)}</div>
          ${playing ? '<button class="ghost" data-action="p_hskip">Saltar este turno</button>' : ''}
          ${playing ? `<button class="ghost" data-action="p_hlobby">${P.confirm === 'lobby' ? 'Toca otra vez para terminar la partida' : 'Terminar partida y volver a la sala'}</button>` : ''}
          <button class="ghost" data-action="p_hclose">${P.confirm === 'close' ? 'Toca otra vez: todos saldrán de la sala' : 'Cerrar la sala'}</button>
          <button class="primary" data-action="p_close">Seguir jugando</button></div>`;
      }
      if (!html) { sh.hidden = true; sh.innerHTML = ''; delete sh.dataset.close; return; }
      sh.className = 'sheet scrim'; sh.innerHTML = html; sh.dataset.close = 'p_close'; sh.hidden = false;
    }

    function render() {
      const head = $('#phHead'), panel = $('#phPanel'), v = P.v;
      let status = '';
      if (P.joined) {
        const ok = local ? (v && v.net === 'open') : P.status === 'open';
        status = ok ? '<span class="net ok" title="Conectado" aria-label="Conectado">Conectado</span>' : '<span class="net bad" title="Conectando" aria-label="Conectando">Conectando…</span>';
      }
      if (v && P.joined) {
        const me = v.players[v.you];
        head.innerHTML = `<button class="me" data-action="p_scores" aria-label="Ver puntajes">${dotFor(me)}${esc(me.name)} <span class="score">${me.score} pts</span></button>
          <div class="tools">${status}
            <button class="iconbtn" data-action="p_zoom" data-d="-4" aria-label="Alejar tablero">−</button><button class="iconbtn" data-action="p_zoom" data-d="4" aria-label="Acercar tablero">+</button>
            ${P.isHost ? '<button class="iconbtn" data-action="p_menu">Menú</button>' : ''}</div>`;
      } else {
        head.innerHTML = `<div class="brand"><div class="logo" aria-hidden="true"><i style="background:#e0533d"></i><i style="background:#e8b52c"></i><i style="background:#2f8f6a"></i><i style="background:#3b5bd6"></i></div><h1>Pistas de Color</h1></div><div class="tools">${status}</div>`;
      }

      let html = '', showBoard = false;
      if (P.rules) {
        html = `<div class="card-plain"><h2>Cómo se juega</h2>${RULES}<button class="primary" data-action="p_rules">Entendido</button></div>`;
      } else if (!P.joined) {
        html = `<div class="card-plain">
          <h2>Entrar a la partida</h2>
          ${P.rejected ? `<p><b>${esc(P.rejected)}</b></p>` : '<p>Escribe el código de la sala y tu nombre.</p>'}
          <label class="eyebrow" for="jcode">Código de la sala</label>
          <input class="text" id="jcode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(P.code)}" style="text-transform:uppercase;letter-spacing:.2em">
          <label class="eyebrow" for="jname">Tu nombre</label>
          <input class="text" id="jname" maxlength="16" autocomplete="off" placeholder="Por ejemplo: Ana" value="${esc(P.name)}">
          ${P.err ? `<p class="net bad">${esc(P.err)}</p>` : ''}
          <button class="primary" data-action="p_join">Entrar</button>
          <button class="linkbtn" data-action="p_rules">Cómo se juega</button></div>`;
      } else if (!v) {
        html = local
          ? `<div class="card-plain"><h2>Abriendo la sala…</h2></div>`
          : `<div class="card-plain"><h2>Entrando a la sala ${esc(P.code)}…</h2>
            <p>${P.err ? esc(P.err) : 'Conectando. Esto tarda unos segundos.'}</p>
            <button class="ghost" data-action="p_leave">Cambiar código o nombre</button></div>`;
      } else {
        const g = v.giver, isG = v.you === g, gname = g >= 0 ? esc(v.players[g].name) : '';
        const myTurn = v.phase === 'guess' && v.order[v.gi] === v.you;
        const tcolor = v.target ? COLORS[v.target.r][v.target.c] : '';
        const peek = isG && v.target ? `<div class="peek" style="--peek:${tcolor}">Mantén pulsado para ver tu color</div>` : '';
        const buzz = buzzHTML(v);
        switch (v.phase) {
          case 'lobby': {
            const players = `<div class="players">${v.players.map((p, i) => `<div class="prow">${dotFor(p)}<span class="nm">${esc(p.name)}${i === v.you ? ' (tú)' : ''}</span>
              ${p.online ? '' : '<span class="net bad">desconectado</span>'}
              ${P.isHost && i !== v.you ? `<button class="x" data-action="p_hkick" data-i="${i}" aria-label="Quitar a ${esc(p.name)}">×</button>` : ''}</div>`).join('')}</div>`;
            if (P.isHost) {
              const n = v.players.length;
              html = `<div class="card-plain"><h2>Tu sala está lista</h2>
                <p>Que los demás escaneen el código con la cámara de su celular, o abran la dirección y escriban el código.</p>
                ${roomHTML(v, true)}
                <h3>Jugadores (${n})</h3>${players}
                ${n < 2 ? '<p class="empty">Esperando a que entre alguien más…</p>' : ''}
                <div class="setting"><h3>¿Cuántas veces da pistas cada persona?</h3>${segHTML('p_hrounds', v.settings.rounds, [[1, '1'], [2, '2'], [3, '3']])}</div>
                <div class="setting"><h3>Tiempo para colocar cada ficha</h3>${segHTML('p_htimer', v.settings.timer, timerOptions)}</div>
                <button class="primary" data-action="p_hstart" ${n >= 2 ? '' : 'disabled'}>${n >= 2 ? 'Empezar partida' : 'Faltan jugadores'}</button>
                <button class="linkbtn" data-action="p_rules">Cómo se juega</button></div>`;
            } else {
              html = `<div class="card-plain"><h2>¡Listo, ${esc(v.players[v.you].name)}!</h2>
                <p>${v.mode === 'phones' ? `Esperando a que ${esc(v.hostName)} empiece la partida.` : 'Esperando a que empiece la partida en el iPad.'}</p>
                ${players}
                ${v.mode === 'phones' ? `<p class="sub">¿Falta alguien? Que entre con este código:</p>${roomHTML(v, true)}` : ''}
                <button class="linkbtn" data-action="p_rules">Cómo se juega</button>
                <button class="ghost" data-action="p_leave">Salir de la sala</button></div>`;
            }
            break;
          }
          case 'pick':
            if (isG) {
              html = `<div class="card-plain"><h2>Elige tu color secreto</h2>
                <p>Que nadie vea tu pantalla. Toca uno de los cuatro.</p>
                <div class="cardpick">${v.card.map((p, i) => {
                  const on = v.target && v.target.r === p.r && v.target.c === p.c;
                  return `<button class="opt" data-action="p_pick" data-i="${i}" aria-pressed="${on}"><span class="fill" style="background:${COLORS[p.r][p.c]}"></span>${coord(p)}</button>`;
                }).join('')}</div>
                <button class="linkbtn" data-action="p_redraw">Sacar otra tarjeta</button>
                <label for="pc1" class="eyebrow">Tu pista de una palabra (opcional: saldrá en las pantallas)</label>
                <input class="text" id="pc1" maxlength="30" autocomplete="off" placeholder="Por ejemplo: aguacate" value="${esc(P.drafts.c1)}">
                <button class="primary" data-action="p_hide" ${v.target ? '' : 'disabled'}>Listo: empezar a adivinar</button></div>`;
            } else {
              showBoard = true;
              html = `<div class="rowx"><div class="who">${dotFor(v.players[g])}<div><div class="eyebrow">Turno ${v.turn + 1} de ${v.total}</div><div class="big">${gname} está eligiendo un color</div></div></div></div>${buzz}`;
            }
            break;
          case 'guess':
            showBoard = true;
            if (myTurn) {
              html = `<div class="rowx"><div class="clue">${clueHTML(v)}</div>${timerHTML(v)}</div>
                <div class="rowx"><div><div class="eyebrow">Te toca · ficha ${v.step} de 2</div>
                  <div class="preview">${P.sel ? `<span class="swatch" style="background:${COLORS[P.sel.r][P.sel.c]}"></span><span class="coord">${coord(P.sel)}</span>` : `<span class="hint ${P.hint ? 'warn' : ''}">${P.hint || 'Toca una casilla del tablero.'}</span>`}</div></div>
                  <button class="primary" data-action="p_place" ${P.sel ? '' : 'disabled'}>Colocar ficha</button></div>`;
            } else {
              const now = v.players[v.order[v.gi]];
              html = `<div class="rowx">${peek}<div class="clue">${clueHTML(v)}</div></div>
                <div class="rowx"><div class="who">${dotFor(now)}<div><div class="eyebrow">Turno de</div><div class="big">${esc(now.name)}</div></div></div>${timerHTML(v)}</div>${buzz}`;
            }
            break;
          case 'clue2':
            showBoard = true;
            html = isG
              ? `<div class="rowx">${peek}<div><div class="eyebrow">Segunda pista</div><div class="big">Hasta dos palabras</div></div></div>
                 <input class="text" id="pc2" maxlength="40" autocomplete="off" placeholder="Escríbela aquí (opcional)" value="${esc(P.drafts.c2)}">
                 <button class="primary" data-action="p_round2">Empezar segunda ronda</button>`
              : `<div class="rowx"><div class="who">${dotFor(v.players[g])}<div><div class="eyebrow">Segunda pista</div><div class="big">${gname} está pensando</div></div></div></div>${buzz}`;
            break;
          case 'ready':
            showBoard = true;
            html = isG
              ? `<div class="rowx">${peek}<div class="big">Todas las fichas están puestas</div></div><button class="primary" data-action="p_reveal">Revelar mi color</button>`
              : `<div class="big">Todas las fichas están puestas</div><p>Esperando a que ${gname} revele su color.</p>${buzz}`;
            break;
          case 'reveal': {
            showBoard = true;
            const mine = v.result ? v.result.pts[v.you] : 0;
            html = `<div class="rowx"><div class="preview"><span class="swatch" style="background:${tcolor}"></span><div><div class="eyebrow">Era</div><span class="coord">${coord(v.target)}</span></div></div>
                <div><div class="eyebrow">${isG ? 'Ganaste por tus pistas' : 'Ganaste'}</div><div class="bigscore">+${mine}</div></div></div>
              <button class="primary" data-action="p_next">${v.turn + 1 >= v.total ? 'Ver resultado final' : 'Siguiente turno'}</button>`;
            break;
          }
          case 'end': {
            const ranked = v.players.map(p => p.score).sort((a, b) => b - a);
            const winners = v.players.filter(p => p.score === ranked[0]);
            html = `<div class="card-plain"><h2>${winners.length > 1 ? '¡Empate!' : '¡Gana ' + esc(winners[0].name) + '!'}</h2>
              ${rankHTML(v.players, v.you)}
              ${P.isHost
                ? '<button class="primary" data-action="p_hrematch">Jugar otra vez</button><button class="ghost" data-action="p_hlobby">Volver a la sala</button>'
                : `<p>${v.mode === 'phones' ? esc(v.hostName) + ' puede empezar otra partida.' : 'Pueden jugar otra vez desde el iPad.'}</p>`}</div>`;
            break;
          }
        }
      }
      const active = document.activeElement, activeId = active && active.id, caret = active && active.selectionStart;
      panel.innerHTML = html;
      if (activeId) { const el = document.getElementById(activeId); if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } }
      wrap.hidden = !showBoard;
      panel.classList.toggle('full', !showBoard);
      if (showBoard && v) {
        applyZoom();
        const myTurn = v.phase === 'guess' && v.order[v.gi] === v.you;
        drawBoard(board, cells, {
          players: v.players, markers: v.markers, sel: myTurn ? P.sel : null, selPlayer: v.you,
          target: v.target, reveal: v.phase === 'reveal',
        });
      }
      renderSheet();
    }

    render();
    if (P.joined) { keepAwake(); phoneConnect(); }
    return { onData };
  }

  /* =====================================================================
     GAME HOST
     mode 'local'  — everyone on one iPad (pass and play)
     mode 'remote' — the iPad shows the board, players join from phones
     mode 'phones' — no iPad: this phone hosts the room and also plays
     ===================================================================== */
  let S, sel = null, ui = { menu: false, rules: false, scores: false, confirmNew: false, hint: '', justPlaced: -1, phonesChoice: false, lastNotice: 0 };
  let phoneApi = null;
  const fresh = (names) => ({
    mode: 'local', room: '', hostPid: '',
    phase: 'setup',
    setup: { names: names || ['', '', '', ''], rounds: 2, timer: 0 },
    players: [], rounds: 2, timer: 0, turn: 0, card: [], target: null,
    clue1: '', clue2: '', step: 1, order: [], gi: 0, markers: [], result: null,
    deadline: 0, timerKey: '', notice: null,
  });
  const save = () => lsSet(KEY, S);
  const load = () => { const v = lsGet(KEY); return v && v.phase ? v : null; };

  const remote = () => S.mode !== 'local';        // players connect over the network
  const phonesOnly = () => S.mode === 'phones';  // no shared table screen
  const giverIdx = () => S.turn % S.players.length;
  const totalTurns = () => S.players.length * S.rounds;
  const guesser = () => S.order[S.gi];
  const occupied = (r, c) => S.markers.some(m => m.r === r && m.c === c);
  const pname = i => esc(S.players[i].name);
  const dot = i => dotFor(S.players[i]);
  const notice = text => { S.notice = { id: Date.now(), text }; };

  function startLocal() {
    S.players = S.setup.names.map((n, i) => ({ name: n.trim() || `Jugador ${i + 1}`, color: PCOLORS[i], score: 0 }));
    S.rounds = S.setup.rounds; S.timer = S.setup.timer; S.turn = 0;
    beginTurn(); keepAwake();
  }
  function startRemote() {
    S.players.forEach(p => { p.score = 0; });
    S.rounds = S.setup.rounds; S.timer = S.setup.timer; S.turn = 0;
    beginTurn(); keepAwake();
  }
  function beginTurn() {
    S.card = drawCard(); S.target = null; S.clue1 = ''; S.clue2 = ''; S.step = 1; S.markers = []; S.result = null;
    const n = S.players.length, g = giverIdx();
    S.order = []; for (let k = 1; k < n; k++) S.order.push((g + k) % n);
    S.gi = 0; S.phase = remote() ? 'pick' : 'handoff'; sel = null; ui.hint = '';
  }
  function drawCard() {
    const out = [];
    while (out.length < 4) {
      const r = rand(ROWS), c = rand(COLS);
      if (out.some(o => Math.max(Math.abs(o.r - r), Math.abs(o.c - c)) < 3)) continue;
      out.push({ r, c });
    }
    return out;
  }
  function advance() {
    sel = null; ui.hint = ''; S.gi++;
    if (S.gi >= S.order.length) S.phase = S.step === 1 ? 'clue2' : 'ready';
  }
  function placeAt(r, c) {
    S.markers.push({ p: guesser(), r, c, step: S.step });
    ui.justPlaced = S.markers.length - 1;
    advance();
  }
  function startRound2() { S.step = 2; S.order.reverse(); S.gi = 0; S.phase = 'guess'; sel = null; }
  function reveal() {
    const t = S.target, g = giverIdx(), pts = S.players.map(() => 0);
    let inFrame = 0;
    S.markers.forEach(m => {
      const d = Math.max(Math.abs(m.r - t.r), Math.abs(m.c - t.c));
      m.pts = d === 0 ? 3 : d === 1 ? 2 : d === 2 ? 1 : 0;
      pts[m.p] += m.pts;
      if (d <= 1) inFrame++;
    });
    pts[g] = inFrame;
    S.players.forEach((p, i) => p.score += pts[i]);
    S.result = { pts }; S.phase = 'reveal';
  }
  function nextTurn() { S.turn++; if (S.turn >= totalTurns()) S.phase = 'end'; else beginTurn(); }
  function undoLast() {
    if (S.phase === 'clue2' || S.phase === 'ready') { S.phase = 'guess'; S.gi = S.order.length; }
    if (S.phase !== 'guess' || S.gi === 0) return;
    const prevP = S.order[S.gi - 1], last = S.markers[S.markers.length - 1];
    if (last && last.p === prevP && last.step === S.step) S.markers.pop(); // a timed-out turn has no marker
    S.gi--; sel = null; ui.hint = '';
  }
  function backToSetup() {
    if (remote()) {
      Object.assign(S, { phase: 'setup', turn: 0, card: [], target: null, clue1: '', clue2: '', step: 1, order: [], gi: 0, markers: [], result: null });
      S.players.forEach(p => { p.score = 0; });
    } else {
      const names = S.players.length ? S.players.map(p => p.name) : S.setup.names;
      const setup = S.setup;
      S = fresh(names); S.setup.rounds = setup.rounds; S.setup.timer = setup.timer;
    }
    sel = null;
  }

  /* ---------- turn timer ---------- */
  function syncTimer() {
    const key = S.phase === 'guess' ? `${S.turn}:${S.step}:${S.gi}` : '';
    if (key === S.timerKey) return;
    S.timerKey = key;
    S.deadline = key && S.timer ? Date.now() + S.timer * 1000 : 0;
    save();
  }
  let lastTableSec = null;
  setInterval(() => {
    if (!S || S.phase !== 'guess' || !S.deadline) { lastTableSec = null; return; }
    const left = S.deadline - Date.now();
    if (!phonesOnly()) {
      const secs = Math.max(0, Math.ceil(left / 1000));
      document.querySelectorAll('#tray .timer').forEach(el => { el.textContent = secs; el.classList.toggle('low', secs <= 5); });
      if (secs !== lastTableSec && secs <= 5) secs ? sfx.tick() : sfx.timeup();
      lastTableSec = secs;
    }
    // phones get a short grace period so a pick made at the buzzer still arrives
    if (left > (remote() ? -1500 : 0)) return;
    const p = guesser();
    if (sel) placeAt(sel.r, sel.c);
    else { advance(); notice(`Se acabó el tiempo de ${S.players[p].name}`); }
    save(); render();
  }, 200);

  /* ---------- hosting a room ---------- */
  let peer = null, hostAttempts = 0;
  const conns = new Map();
  const lastBuzz = new Map();
  const net = { status: 'off', error: '' };

  function joinURL() {
    const q = testQuery(); q.set('sala', S.room);
    return location.origin + location.pathname + '?' + q.toString();
  }
  function startHost() {
    if (peer || !remote()) return;
    if (!canNet || !/^https?:$/.test(location.protocol)) {
      net.status = 'error'; net.error = 'No se puede abrir la sala desde aquí. Abre el juego desde su página web.'; return;
    }
    if (!S.room) { S.room = newCode(); save(); }
    net.status = 'connecting'; net.error = '';
    const p = new Peer(PREFIX + S.room, PEER_OPTS);
    peer = p;
    p.on('open', () => { if (peer !== p) return; hostAttempts = 0; net.status = 'open'; net.error = ''; render(); });
    p.on('connection', c => setupConn(c));
    p.on('disconnected', () => {
      if (peer !== p) return;
      net.status = 'connecting'; render();
      setTimeout(() => { if (peer === p && !p.destroyed && p.disconnected) p.reconnect(); }, 2000);
    });
    p.on('error', err => {
      if (peer !== p) return;
      if (err.type === 'unavailable-id') {
        // the code is still held (e.g. right after a reload): wait, or pick a new one if nobody joined yet
        p.destroy(); peer = null; hostAttempts++;
        if (S.phase === 'setup' && !S.players.some(q => q.pid !== S.hostPid) && hostAttempts >= 2) { S.room = newCode(); save(); }
        net.status = 'connecting'; render();
        setTimeout(startHost, 3000);
        return;
      }
      if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(err.type)) {
        net.status = 'connecting'; net.error = 'Sin conexión con el servidor. Reintentando…'; render();
        setTimeout(() => { if (peer === p && !p.destroyed && p.disconnected) p.reconnect(); }, 3000);
        return;
      }
      if (err.type === 'browser-incompatible') { net.status = 'error'; net.error = 'Este navegador no permite jugar con celulares. Usa Safari o Chrome.'; render(); }
    });
  }
  function stopHost() {
    conns.forEach(c => { if (!c.local) { try { c.send({ t: 'closed' }); } catch (e) {} try { c.close(); } catch (e) {} } });
    conns.clear();
    if (peer) { const p = peer; peer = null; setTimeout(() => { try { p.destroy(); } catch (e) {} }, 300); }
    net.status = 'off'; net.error = '';
  }
  function setupConn(c) {
    c.on('data', d => onHostData(c, d));
    const gone = () => {
      if (c.pid && conns.get(c.pid) === c) {
        conns.delete(c.pid);
        const p = S.players.find(q => q.pid === c.pid); if (p) p.online = false;
        render();
      }
    };
    c.on('close', gone); c.on('error', gone);
  }
  function onHostData(c, d) {
    if (!d || typeof d !== 'object' || !remote()) return;
    if (d.t === 'hello' && !c.local) {
      const name = String(d.name || '').trim().slice(0, 16) || 'Jugador';
      const pid = String(d.pid || '').slice(0, 40);
      if (!pid || pid === S.hostPid) return;
      let i = S.players.findIndex(p => p.pid === pid);
      if (i < 0) i = S.players.findIndex(p => !p.online && p.name.toLowerCase() === name.toLowerCase());
      if (i < 0) {
        const reject = msg => { try { c.send({ t: 'reject', msg }); } catch (e) {} setTimeout(() => { try { c.close(); } catch (e) {} }, 500); };
        if (S.phase !== 'setup') return reject('La partida ya empezó. Podrás entrar en la siguiente.');
        if (S.players.length >= 10) return reject('La sala está llena: el máximo es 10 jugadores.');
        const used = new Set(S.players.map(p => p.color));
        S.players.push({ name, color: PCOLORS.find(col => !used.has(col)) || PCOLORS[0], score: 0, pid, online: true });
        i = S.players.length - 1;
      }
      const pl = S.players[i];
      pl.pid = pid; pl.online = true;
      if (S.phase === 'setup') pl.name = name;
      const old = conns.get(pid); if (old && old !== c) { try { old.close(); } catch (e) {} }
      c.pid = pid; conns.set(pid, c);
      save(); render();
      return;
    }
    if (d.t !== 'act') return;
    const i = S.players.findIndex(p => p.pid === c.pid);
    if (i < 0) return;
    if (typeof d.a === 'string' && d.a.startsWith('h_')) { if (c.local) hostAct(d); return; }
    if (d.a === 'buzz') { relayBuzz(i); return; }
    remoteAct(i, d);
  }
  // actions only the host phone may take ("solo celulares")
  function hostAct(d) {
    switch (d.a) {
      case 'h_set':
        if (S.phase !== 'setup') return;
        if (d.k === 'rounds' && [1, 2, 3].includes(d.v)) S.setup.rounds = d.v;
        if (d.k === 'timer' && TIMER_OPTIONS.includes(d.v)) S.setup.timer = d.v;
        break;
      case 'h_start': if (S.phase === 'setup' && S.players.length >= 2) startRemote(); break;
      case 'h_kick': {
        const p = S.players[d.i];
        if (S.phase !== 'setup' || !p || p.pid === S.hostPid) return;
        const c = conns.get(p.pid);
        if (c) { try { c.send({ t: 'reject', msg: 'Te quitaron de la sala.' }); } catch (e) {} setTimeout(() => { try { c.close(); } catch (e) {} }, 500); conns.delete(p.pid); }
        S.players.splice(d.i, 1);
        break;
      }
      case 'h_skip': if (S.phase !== 'setup' && S.phase !== 'end') nextTurn(); break;
      case 'h_lobby': backToSetup(); break;
      case 'h_rematch': if (S.phase === 'end') startRemote(); break;
      case 'h_close':
        stopHost(); S = fresh(); save();
        setTimeout(() => location.reload(), 400);
        return;
      default: return;
    }
    save(); render();
  }
  function remoteAct(i, d) {
    if (S.phase === 'setup' || S.phase === 'end' || d.turn !== S.turn) return;
    const g = giverIdx();
    switch (d.a) {
      case 'pickCard': if (S.phase === 'pick' && i === g && S.card[d.i]) S.target = { ...S.card[d.i] }; break;
      case 'redraw': if (S.phase === 'pick' && i === g) { S.card = drawCard(); S.target = null; } break;
      case 'hideCard': if (S.phase === 'pick' && i === g && S.target) { S.clue1 = cleanClue(d.clue); S.phase = 'guess'; S.step = 1; S.gi = 0; } break;
      case 'place': {
        const r = d.r | 0, c = d.c | 0;
        if (S.phase === 'guess' && i === guesser() && r >= 0 && r < ROWS && c >= 0 && c < COLS && !occupied(r, c)) placeAt(r, c);
        break;
      }
      case 'round2': if (S.phase === 'clue2' && i === g) { S.clue2 = cleanClue(d.clue); startRound2(); } break;
      case 'reveal': if (S.phase === 'ready' && i === g) reveal(); break;
      case 'next': if (S.phase === 'reveal') nextTurn(); break;
      default: return;
    }
    save(); render();
  }
  function relayBuzz(i) {
    if (!BUZZ_PHASES.includes(S.phase)) return;
    const to = S.phase === 'guess' ? guesser() : giverIdx();
    if (to === i || to == null) return;
    const pid = S.players[i].pid, now = Date.now();
    if (now - (lastBuzz.get(pid) || 0) < 1400) return;
    lastBuzz.set(pid, now);
    const msg = { t: 'buzz', from: i, to, sound: rand(sfx.buzz.length), text: BUZZ_TEXTS[rand(BUZZ_TEXTS.length)] };
    conns.forEach(c => { if (c.open) { try { c.send(msg); } catch (e) {} } });
    if (S.mode === 'remote') buzzFX({ from: S.players[i], to: S.players[to], big: true, text: msg.text, sound: msg.sound });
  }
  function viewFor(i) {
    const lobby = S.phase === 'setup';
    const g = lobby ? -1 : giverIdx();
    const phase = lobby ? 'lobby' : S.phase;
    const isG = i === g;
    const host = S.players.find(p => p.pid === S.hostPid);
    return {
      phase, mode: S.mode, you: i, turn: S.turn, total: lobby ? 0 : totalTurns(), giver: g,
      order: S.order, gi: S.gi, step: S.step,
      players: S.players.map(p => ({ name: p.name, color: p.color, score: p.score, online: !!p.online })),
      markers: S.markers.map(m => ({ p: m.p, r: m.r, c: m.c, pts: phase === 'reveal' ? m.pts : null })),
      clue1: phase === 'pick' ? '' : S.clue1, clue2: S.clue2,
      target: S.target && (isG || phase === 'reveal') ? S.target : null,
      card: isG && phase === 'pick' ? S.card : null,
      result: phase === 'reveal' ? S.result : null,
      timer: S.timer, timeLeft: S.phase === 'guess' && S.deadline ? Math.max(0, S.deadline - Date.now()) : null,
      notice: S.notice && Date.now() - S.notice.id < 4000 ? S.notice : null,
      room: S.room, url: S.room ? joinURL() : '', net: net.status, hostName: host ? host.name : '',
      settings: { rounds: S.setup.rounds, timer: S.setup.timer },
    };
  }
  function broadcast() {
    conns.forEach((c, pid) => {
      const i = S.players.findIndex(p => p.pid === pid);
      if (i >= 0 && c.open) { try { c.send({ t: 'state', v: viewFor(i) }); } catch (e) {} }
    });
  }

  // "solo celulares": this device is both the room and a player
  function bootPhonesHost() {
    const host = S.players.find(p => p.pid === S.hostPid);
    if (!host) { S = fresh(); save(); location.reload(); return; }
    host.online = true;
    const localConn = { pid: S.hostPid, open: true, local: true, send: d => setTimeout(() => phoneApi && phoneApi.onData(d), 0) };
    conns.set(S.hostPid, localConn);
    phoneApi = phoneMain({ pid: S.hostPid, name: host.name, room: () => S.room, send: d => setTimeout(() => onHostData(localConn, d), 0) });
    keepAwake();
    startHost();
    render();
  }

  /* ---------- table actions ---------- */
  Object.assign(actions, {
    menu() { ui.menu = true; ui.confirmNew = false; render(); },
    closeMenu() { ui.menu = false; ui.rules = false; ui.scores = false; render(); },
    rules() { ui.rules = true; render(); },
    closeRules() { ui.rules = false; render(); },
    scores() { ui.scores = true; render(); },
    newGame() {
      if (!ui.confirmNew) { ui.confirmNew = true; render(); return; }
      backToSetup(); ui.menu = false; ui.confirmNew = false; save(); render();
    },
    skipTurn() { nextTurn(); ui.menu = false; save(); render(); },
    mode(el) {
      const v = el.dataset.v;
      if (v === 'phones') {
        if (S.mode === 'remote') { stopHost(); S.mode = 'local'; S.players = []; }
        ui.phonesChoice = true;
      } else {
        ui.phonesChoice = false;
        if (v === 'remote' && S.mode !== 'remote') { S.mode = 'remote'; S.players = []; startHost(); }
        if (v === 'local' && S.mode !== 'local') { stopHost(); S.mode = 'local'; S.players = []; }
      }
      save(); render();
    },
    createPhones() {
      const name = ($('#hostname').value || '').trim().slice(0, 16);
      if (!name) { ui.hint = 'Escribe tu nombre para crear la sala.'; render(); return; }
      S.mode = 'phones'; S.hostPid = newPid(); S.room = newCode(); S.phase = 'setup';
      S.players = [{ name, color: PCOLORS[0], score: 0, pid: S.hostPid, online: true }];
      ui.phonesChoice = false; ui.hint = '';
      $('#sheet').hidden = true;
      save(); bootPhonesHost();
    },
    addPlayer() { if (S.setup.names.length < 10) { S.setup.names.push(''); save(); render(); const ins = document.querySelectorAll('.prow input'); if (ins.length) ins[ins.length - 1].focus(); } },
    removePlayer(el) { if (S.setup.names.length > 2) { S.setup.names.splice(+el.dataset.i, 1); save(); render(); } },
    kick(el) {
      const i = +el.dataset.i, p = S.players[i]; if (!p) return;
      const c = conns.get(p.pid);
      if (c) { try { c.send({ t: 'reject', msg: 'Te quitaron de la sala.' }); } catch (e) {} setTimeout(() => { try { c.close(); } catch (e) {} }, 500); conns.delete(p.pid); }
      S.players.splice(i, 1); save(); render();
    },
    rounds(el) { S.setup.rounds = +el.dataset.v; save(); render(); },
    timer(el) { S.setup.timer = +el.dataset.v; save(); render(); },
    start() { remote() ? startRemote() : startLocal(); save(); render(); },
    showCard() { S.phase = 'pick'; save(); render(); },
    pickCard(el) { S.target = { ...S.card[+el.dataset.i] }; save(); render(); },
    redraw() { S.card = drawCard(); S.target = null; save(); render(); },
    hideCard() { if (!S.target) return; S.phase = 'guess'; S.step = 1; S.gi = 0; save(); render(); },
    place() { if (!sel) return; placeAt(sel.r, sel.c); save(); render(); },
    undo() { undoLast(); save(); render(); },
    round2() { startRound2(); save(); render(); },
    reveal() { reveal(); save(); render(); },
    next() { nextTurn(); save(); render(); },
    rematch() {
      if (remote()) { startRemote(); }
      else { const names = S.players.map(p => p.name), setup = S.setup; S = fresh(names); S.setup.rounds = setup.rounds; S.setup.timer = setup.timer; startLocal(); }
      save(); render();
    },
    toSetup() { backToSetup(); save(); render(); },
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('.prow input')) {
      S.setup.names[+t.dataset.i] = t.value;
      const d = t.parentElement.querySelector('.dot'); if (d) d.textContent = initial(t.value || 'J');
      save();
    }
    if (t.id === 'clue1in') { S.clue1 = t.value; save(); }
    if (t.id === 'clue2in') { S.clue2 = t.value; save(); }
  });

  /* ---------- table board ---------- */
  const board = $('#board');
  const cells = buildBoard(board);
  board.addEventListener('click', e => {
    const d = e.target.closest('.cell'); if (!d || S.phase !== 'guess') return;
    const r = +d.dataset.r, c = +d.dataset.c;
    if (occupied(r, c)) { ui.hint = 'Esa casilla ya tiene una ficha. Elige otra.'; sel = null; }
    else { sel = (sel && sel.r === r && sel.c === c) ? null : { r, c }; ui.hint = ''; }
    renderBoard(); renderTray();
  });
  function fit() {
    const st = $('#stage'), W = st.clientWidth, H = st.clientHeight;
    const cell = Math.max(8, Math.floor(Math.min(W / 33, H / 17.95)));
    board.style.setProperty('--cell', cell + 'px');
    board.style.setProperty('--gap', Math.max(1, Math.round(cell * 0.07)) + 'px');
  }
  new ResizeObserver(fit).observe($('#stage'));

  function renderBoard() {
    if (!S.players.length || S.phase === 'setup') { drawBoard(board, cells, { players: [], markers: [] }); return; }
    drawBoard(board, cells, {
      players: S.players, markers: S.markers, drop: ui.justPlaced,
      sel: S.phase === 'guess' ? sel : null, selPlayer: S.phase === 'guess' ? guesser() : null,
      target: S.phase === 'reveal' ? S.target : null, reveal: S.phase === 'reveal',
    });
    ui.justPlaced = -1;
  }

  /* ---------- header ---------- */
  function renderHeader() {
    const playing = S.players.length && S.phase !== 'setup';
    $('#turninfo').textContent = playing && S.phase !== 'end'
      ? `Turno ${S.turn + 1} de ${totalTurns()} · Vuelta ${Math.floor(S.turn / S.players.length) + 1} de ${S.rounds}` : '';
    $('#scores').innerHTML = !playing ? '' : S.players.map((p, i) => {
      const isG = i === giverIdx() && S.phase !== 'end';
      const isNow = S.phase === 'guess' && i === guesser();
      const off = remote() && !p.online;
      return `<span class="chip${isNow ? ' now' : ''}${off ? ' off' : ''}" data-action="scores" ${off ? 'title="Desconectado"' : ''}>${dot(i)}${esc(p.name)}${isG ? ' <span class="tag">pista</span>' : ''} <b>${p.score}</b></span>`;
    }).join('');
    $('#menuBtn').hidden = S.phase === 'setup';
  }

  /* ---------- tray ---------- */
  function clueBlock() {
    const g = giverIdx();
    if (S.step === 1) {
      return S.clue1.trim()
        ? `<div class="eyebrow">Pista de ${pname(g)}</div><div class="cluetext">«${esc(S.clue1.trim())}»</div>`
        : `<div class="eyebrow">Pista de ${pname(g)}</div><div class="cluetext quiet">Escucha la pista de una palabra.</div>`;
    }
    const first = S.clue1.trim() ? `Primera: «${esc(S.clue1.trim())}»` : '';
    return S.clue2.trim()
      ? `<div class="eyebrow">Segunda pista de ${pname(g)}</div><div class="cluetext">«${esc(S.clue2.trim())}»<small>${first}</small></div>`
      : `<div class="eyebrow">Segunda pista de ${pname(g)}</div><div class="cluetext quiet">Escucha la pista de dos palabras.${first ? '<br>' + first : ''}</div>`;
  }
  const offNote = i => remote() && !S.players[i].online ? ' <span class="net bad">desconectado</span>' : '';
  const tableTimer = () => S.phase === 'guess' && S.timer && S.deadline ? `<span class="timer">${Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000))}</span>` : '';

  function renderTray() {
    const tray = $('#tray'), g = S.players.length ? giverIdx() : 0;
    const hiddenPhases = remote() ? ['setup', 'end'] : ['setup', 'end', 'handoff', 'pick'];
    tray.hidden = hiddenPhases.includes(S.phase);
    if (tray.hidden) { tray.innerHTML = ''; return; }
    if (S.phase === 'pick') {
      tray.innerHTML = `
        <div class="who">${dot(g)}<div><div class="eyebrow">Turno ${S.turn + 1} de ${totalTurns()}</div><div class="big">${pname(g)} está eligiendo su color</div><div class="sub">En su celular. Los demás, atentos a la pista.${offNote(g)}</div></div></div>`;
    } else if (S.phase === 'guess') {
      const p = guesser();
      tray.innerHTML = `
        <div class="who">${dot(p)}<div><div class="eyebrow">Te toca</div><div class="big">${pname(p)}</div><div class="sub">Ficha ${S.step} de 2 · ${S.gi + 1}/${S.order.length}${remote() ? ' · desde su celular o aquí' : ''}${offNote(p)}</div></div></div>
        ${tableTimer()}
        <div class="clue">${clueBlock()}</div>
        <div class="preview">${sel
          ? `<span class="swatch" style="background:${COLORS[sel.r][sel.c]}"></span><span class="coord">${coord(sel)}</span>`
          : `<span class="hint ${ui.hint ? 'warn' : ''}">${ui.hint || 'Toca una casilla del tablero.'}</span>`}</div>
        <div class="btns">
          <button class="ghost" data-action="undo" ${S.gi > 0 ? '' : 'disabled'}>Deshacer</button>
          <button class="primary" data-action="place" ${sel ? '' : 'disabled'}>Colocar ficha</button>
        </div>`;
    } else if (S.phase === 'clue2') {
      tray.innerHTML = remote() ? `
        <div class="who">${dot(g)}<div><div class="eyebrow">Segunda pista</div><div class="big">${pname(g)} está pensando</div><div class="sub">Dará una pista de hasta dos palabras.${offNote(g)}</div></div></div>
        <div class="btns"><button class="ghost" data-action="undo">Deshacer</button></div>` : `
        <div class="who">${dot(g)}<div><div class="eyebrow">Segunda pista</div><div class="big">${pname(g)}</div><div class="sub">Mira las fichas y da una pista de hasta dos palabras.</div></div></div>
        <div class="peek" style="--peek:${COLORS[S.target.r][S.target.c]}">Mantén pulsado para ver tu color</div>
        <div class="clue"><input class="text" id="clue2in" maxlength="40" autocomplete="off" placeholder="Escríbela aquí (opcional)" value="${esc(S.clue2)}"></div>
        <div class="btns">
          <button class="ghost" data-action="undo">Deshacer</button>
          <button class="primary" data-action="round2">Empezar segunda ronda</button>
        </div>`;
    } else if (S.phase === 'ready') {
      tray.innerHTML = `
        <div class="who">${dot(g)}<div><div class="eyebrow">Todas las fichas están puestas</div><div class="big">${pname(g)}, revela tu color</div></div></div>
        <div class="btns">
          <button class="ghost" data-action="undo">Deshacer</button>
          <button class="primary" data-action="reveal">Revelar</button>
        </div>`;
    } else if (S.phase === 'reveal') {
      const last = S.turn + 1 >= totalTurns();
      const order = [g, ...S.order.slice().sort((a, b) => a - b)];
      tray.innerHTML = `
        <div class="preview"><span class="swatch" style="background:${COLORS[S.target.r][S.target.c]}"></span><div><div class="eyebrow">Era</div><span class="coord">${coord(S.target)}</span></div></div>
        <div class="results">${order.map(i => `<span class="res">${dot(i)}${pname(i)} <b>+${S.result.pts[i]}</b></span>`).join('')}</div>
        <div class="btns"><button class="primary" data-action="next">${last ? 'Ver resultado final' : 'Siguiente turno'}</button></div>`;
    }
  }

  /* ---------- sheets ---------- */
  function netLine() {
    if (net.status === 'open') return `<span class="net ok">Sala abierta</span>`;
    if (net.status === 'error') return `<span class="net bad">${esc(net.error)}</span>`;
    return `<span class="net bad">${esc(net.error || 'Abriendo la sala…')}</span>`;
  }

  function sheetHTML() {
    if (ui.rules) return ['scrim', '', `<h2>Cómo se juega</h2>${RULES}<div class="row end"><button class="primary" data-action="closeRules">Entendido</button></div>`, 'closeRules'];
    if (ui.scores && S.players.length) return ['scrim', 'small', `
      <div class="eyebrow">${S.phase === 'end' ? 'Resultado final' : `Turno ${S.turn + 1} de ${totalTurns()}`}</div>
      <h2>Así van</h2>${rankHTML(S.players, -1)}
      <button class="primary" data-action="closeMenu">Cerrar</button>`, 'closeMenu'];
    if (ui.menu) return ['scrim', '', `
      <h2>Menú</h2>
      <div class="row"><button class="primary" data-action="closeMenu">Seguir jugando</button><button class="ghost" data-action="rules">Cómo se juega</button></div>
      ${S.phase !== 'end' ? '<div class="row"><button class="ghost" data-action="skipTurn">Saltar este turno</button></div>' : ''}
      <div class="row"><button class="ghost" data-action="newGame">${ui.confirmNew ? 'Toca otra vez para terminar esta partida' : 'Nueva partida'}</button></div>
      ${remote() ? `<p class="sub">Sala <b>${esc(S.room)}</b> · ${netLine()}<br>Si alguien se desconecta, que vuelva a abrir el enlace y entre con el mismo nombre.</p><p class="url">${esc(joinURL())}</p>` : ''}
      <p class="sub">La partida se guarda sola en este iPad. Si cierras la página, la encontrarás donde la dejaste.</p>`, 'closeMenu'];
    const g = S.players.length ? giverIdx() : 0;
    switch (S.phase) {
      case 'setup': {
        const choice = ui.phonesChoice ? 'phones' : S.mode;
        const modeSeg = `<div class="seg" role="group" aria-label="Modo de juego">
            <button data-action="mode" data-v="local" aria-pressed="${choice === 'local'}">Un solo iPad</button>
            <button data-action="mode" data-v="remote" aria-pressed="${choice === 'remote'}">iPad + celulares</button>
            <button data-action="mode" data-v="phones" aria-pressed="${choice === 'phones'}">Solo celulares</button></div>`;
        const settings = n => `
          <div class="setting"><h3>¿Cuántas veces da pistas cada persona?</h3>
            <div class="row">${segHTML('rounds', S.setup.rounds, [[1, '1'], [2, '2'], [3, '3']])}<span class="sub">${n * S.setup.rounds} turnos en total</span></div></div>
          <div class="setting"><h3>Tiempo para colocar cada ficha</h3>${segHTML('timer', S.setup.timer, timerOptions)}</div>`;
        if (choice === 'phones') {
          return ['scrim', '', `
            <h2>Pistas de Color</h2>
            ${modeSeg}
            <p class="lead">Sin iPad: este celular abre la sala y también juega. Los demás entran escaneando el código QR que aparecerá en tu pantalla.</p>
            <label class="eyebrow" for="hostname">Tu nombre</label>
            <input class="text" id="hostname" maxlength="16" autocomplete="off" placeholder="Por ejemplo: Mamá">
            ${ui.hint ? `<p class="net bad">${esc(ui.hint)}</p>` : ''}
            <p class="sub">Mantén tu pantalla encendida durante la partida: tu celular es la sala.</p>
            <div class="row end"><button class="linkbtn" data-action="rules">Cómo se juega</button><button class="primary" data-action="createPhones">Crear sala</button></div>`];
        }
        if (remote()) {
          const url = joinURL(), n = S.players.length;
          return ['scrim', 'wide', `
            <h2>Pistas de Color</h2>
            ${modeSeg}
            <div class="lobby">
              <div class="qr" aria-label="Código QR para entrar">${net.status === 'open' ? qrSVG(url) : ''}</div>
              <div class="stack">
                <div class="eyebrow">Código de la sala</div>
                <div class="roomcode">${esc(S.room || '····')}</div>
                <p>Escaneen el código QR con la cámara del celular, o abran esta dirección y escriban el código:</p>
                <div class="url">${esc(url)}</div>
                ${netLine()}
              </div>
            </div>
            <h3>Jugadores conectados</h3>
            <div class="players">${n ? S.players.map((p, i) => `
              <div class="prow">${dotFor(p)}<span class="nm">${esc(p.name)}</span>${p.online ? '<span class="net ok">listo</span>' : '<span class="net bad">desconectado</span>'}
                <button class="x" data-action="kick" data-i="${i}" aria-label="Quitar a ${esc(p.name)}">×</button></div>`).join('')
              : '<div class="empty">Todavía no ha entrado nadie. Cuando alguien entre, aparecerá aquí.</div>'}
            </div>
            ${settings(n)}
            <div class="row end"><button class="linkbtn" data-action="rules">Cómo se juega</button><button class="primary" data-action="start" ${n >= 2 ? '' : 'disabled'}>${n >= 2 ? 'Empezar partida' : 'Faltan jugadores'}</button></div>`];
        }
        const names = S.setup.names;
        return ['scrim', '', `
          <h2>Pistas de Color</h2>
          <p class="lead">Una persona ve un color en secreto y da pistas. Los demás intentan encontrarlo entre 480 casillas.</p>
          ${modeSeg}
          <h3>Jugadores</h3>
          <div class="players">${names.map((name, i) => `
            <div class="prow"><span class="dot" style="--pc:${PCOLORS[i]}">${esc(initial(name || 'J'))}</span>
              <input class="text" id="p${i}" data-i="${i}" maxlength="16" autocomplete="off" placeholder="Jugador ${i + 1}" value="${esc(name)}">
              <button class="x" data-action="removePlayer" data-i="${i}" aria-label="Quitar jugador" ${names.length <= 2 ? 'disabled' : ''}>×</button></div>`).join('')}
          </div>
          ${names.length < 10 ? '<div><button class="linkbtn" data-action="addPlayer">+ Añadir jugador</button></div>' : ''}
          ${settings(names.length)}
          <div class="row end"><button class="linkbtn" data-action="rules">Cómo se juega</button><button class="primary" data-action="start">Empezar partida</button></div>`];
      }
      case 'handoff':
        return ['private', '', `
          <div class="eyebrow">Turno ${S.turn + 1} de ${totalTurns()}</div>
          <div class="who">${dot(g)}<h2>Le toca dar la pista a ${pname(g)}</h2></div>
          <p class="lead">Pásale el iPad a ${pname(g)}. Los demás, no miren la pantalla hasta que diga la pista.</p>
          <div class="row end"><button class="primary" data-action="showCard">Soy ${pname(g)}: ver mi tarjeta</button></div>`];
      case 'pick':
        if (remote()) return null;
        return ['private', '', `
          <h2>Elige tu color secreto</h2>
          <p>Toca uno de los cuatro. Luego piensa una pista de una palabra, sin nombrar colores.</p>
          <div class="cardpick">${S.card.map((p, i) => {
            const on = S.target && S.target.r === p.r && S.target.c === p.c;
            return `<button class="opt" data-action="pickCard" data-i="${i}" aria-pressed="${on}"><span class="fill" style="background:${COLORS[p.r][p.c]}"></span>${coord(p)}</button>`;
          }).join('')}</div>
          <div><button class="linkbtn" data-action="redraw">Sacar otra tarjeta</button></div>
          <label for="clue1in" class="eyebrow">Tu pista (opcional: se mostrará a todos)</label>
          <input class="text" id="clue1in" maxlength="30" autocomplete="off" placeholder="Por ejemplo: aguacate" value="${esc(S.clue1)}">
          <div class="row end"><button class="primary" data-action="hideCard" ${S.target ? '' : 'disabled'}>Listo: ocultar y empezar</button></div>`];
      case 'end': {
        const ranked = S.players.map(p => p.score).sort((a, b) => b - a);
        const winners = S.players.filter(p => p.score === ranked[0]);
        const title = winners.length > 1
          ? `¡Empate entre ${winners.slice(0, -1).map(w => esc(w.name)).join(', ')} y ${esc(winners[winners.length - 1].name)}!`
          : `¡Gana ${esc(winners[0].name)}!`;
        return ['scrim', '', `
          <div class="eyebrow">Fin de la partida</div>
          <h2>${title}</h2>
          ${rankHTML(S.players, -1)}
          <div class="row end"><button class="ghost" data-action="toSetup">Cambiar jugadores</button><button class="primary" data-action="rematch">Jugar otra vez</button></div>`];
      }
    }
    return null;
  }

  function renderSheet() {
    const sh = $('#sheet'), res = sheetHTML();
    if (!res) { sh.hidden = true; sh.innerHTML = ''; delete sh.dataset.close; return; }
    const active = document.activeElement, activeId = active && active.id, val = active && active.value;
    sh.className = 'sheet ' + res[0];
    sh.innerHTML = `<div class="card ${res[1]}" role="dialog" aria-modal="true">${res[2]}</div>`;
    if (res[3]) sh.dataset.close = res[3]; else delete sh.dataset.close;
    sh.hidden = false;
    if (activeId) { const el = document.getElementById(activeId); if (el && el.tagName === 'INPUT') { if (activeId === 'hostname') el.value = val; el.focus(); } }
  }

  function render() {
    if (S.phase === 'guess' || S.timerKey) syncTimer();
    if (phonesOnly()) { broadcast(); return; }
    renderHeader(); renderBoard(); renderTray(); renderSheet();
    if (S.notice && S.notice.id !== ui.lastNotice && Date.now() - S.notice.id < 4000) { ui.lastNotice = S.notice.id; showToast(S.notice.text); }
    if (remote()) broadcast();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !S) return;
    if (S.phase !== 'setup' || phonesOnly()) keepAwake();
    if (remote() && peer && !peer.destroyed && peer.disconnected) peer.reconnect();
  });

  /* ---------- boot ---------- */
  function start(data) {
    S = (data && data.state) || load() || fresh();
    S = Object.assign(fresh(), S);
    S.setup = Object.assign({ rounds: 2, timer: 0, names: ['', '', '', ''] }, S.setup);
    S.players.forEach(p => { p.online = false; });
    if (phonesOnly()) { bootPhonesHost(); return; }
    fit();
    if (remote()) startHost();
    render();
    if (S.phase !== 'setup') keepAwake();
  }
  window.claude?.hot?.snapshot?.(() => ({ state: S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
